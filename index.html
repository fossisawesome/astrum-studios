<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Astrum Studios is a game modding studio. Current project: SCP: Security Breach, a mod for Pavlov Shack."
    />
    <link rel="icon" type="image/png" href="/favicon-on-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-on-dark.png" media="(prefers-color-scheme: dark)" />
    <title>Astrum Studios</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('astrum-theme');
          if (saved === 'dark' || saved === 'light') t = saved;
          else if (matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Astrum Studios. This site needs JavaScript. Contact: discord.gg/Yu2R3brutR</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
